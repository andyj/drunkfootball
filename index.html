<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Drunk Football</title>
  <!--
    Fullscreen on a phone is asked for on the first tap, but an iPhone will not grant it:
    Safari has no Fullscreen API there at all. These are the way round it. Added to the
    home screen, the game launches with no browser furniture at all, which is the same
    thing by a different route, and the status bar is told to sit over the game's own black
    rather than painting a white strip above it.
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Drunk Football">
  <meta name="theme-color" content="#101319">
  <!--
    Without an apple-touch-icon iOS uses a screenshot of the page as the home screen
    icon, so the thing this whole route exists for arrives looking like a mistake.
  -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #101319; }
    body {
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      /*
       * Launched from the home screen the page owns the whole display, island and
       * home bar included. Insetting by the safe area keeps the pitch out from under
       * them; in a browser tab every inset is 0 and this changes nothing.
       */
      box-sizing: border-box;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    canvas { display: block; }

    /*
     * A phone held upright shows a 16:9 pitch as a strip barely a finger tall, which reads
     * as broken rather than as small. Pure CSS, so it is right before a single line of the
     * game has run.
     *
     * The card is styled here and hidden here; the media query below does nothing but
     * decide which of the two is on screen. Keeping the look outside the query is what
     * makes it possible to look at without a phone in your hand.
     */
    #rotate {
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; text-align: center; padding: 0 32px; color: #f2f2ea;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #rotate .shout {
      font-family: "Bangers", system-ui, sans-serif; font-size: 44px;
      letter-spacing: 0.04em; line-height: 1.1;
    }
    #rotate .phone {
      width: 62px; height: 104px; border: 5px solid #ffd166; border-radius: 12px;
      animation: tip 2.2s ease-in-out infinite;
    }
    #rotate .quiet { color: #9aa4b2; font-size: 15px; }

    /*
     * iOS exposes no way to go fullscreen from script, so the only person who can do
     * it is the reader, through Safari's share sheet. This is the moment to say so:
     * a phone is held upright when the game is opened, so this card is already in
     * front of them, and unlike an overlay on the game it covers nothing.
     */
    #install { display: none; margin-top: 6px; font-size: 14px; color: #9aa4b2; }
    #install b { color: #ffd166; font-weight: 600; }
    body.can-install #install { display: block; }

    /* Coarse pointer only, so a narrow desktop window is left alone. */
    @media (orientation: portrait) and (pointer: coarse) {
      #game { display: none; }
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate">
    <div class="phone"></div>
    <div class="shout">TURN YOUR PHONE SIDEWAYS</div>
    <div class="quiet">the pitch is wider than it is tall, and so are you by now</div>
    <div id="install">
      <b>Share &rarr; Add to Home Screen</b><br>and the browser gets out of the way
    </div>
  </div>
  <script>
    /*
     * navigator.standalone is the iOS answer, display-mode covers Android. Either
     * way, once it is installed the advice is wrong and must not be shown.
     */
    (function () {
      var installed = window.navigator.standalone === true
        || matchMedia('(display-mode: standalone)').matches
        || matchMedia('(display-mode: fullscreen)').matches;
      if (!installed) document.body.classList.add('can-install');
    }());
  </script>
  <!-- Arcade-only Phaser build: everything this game uses, a fraction of the full bundle. -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser-arcade-physics.min.js"></script>
  <script src="audio.js"></script>
  <script src="render.js"></script>
  <script src="game.js"></script>
</body>
</html>
